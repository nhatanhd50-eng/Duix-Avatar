name: Build APK Online

# Cho phép bạn bấm nút chạy thủ công thay vì phải đẩy code (commit)
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải code về máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt Java JDK 11 (Duix cần Java 11)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Bước 3: Cấp quyền thực thi cho Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Bước 4: Bắt đầu build (chạy lệnh assembleDebug)
    # Lưu ý: Quá trình này sẽ mất khoảng 15-30 phút
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # Bước 5: Thu thập file APK vừa build
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        # Tìm tất cả file .apk và tải về
        path: '**/*.apk'
