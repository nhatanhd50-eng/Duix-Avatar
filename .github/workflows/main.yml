name: Build APK Online

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # ------------------------------------------
    # PHẦN QUAN TRỌNG: TÌM FILE APK ĐỂ TẢI VỀ
    # ------------------------------------------

    # Bước 1: Dùng lệnh "find" để đào bới tìm hết file .apk trong dự án
    - name: Find APK location
      id: find_apk
      run: |
        # Tìm file .apk, loại bỏ file trống (size = 0)
        # Kết quả đường dẫn sẽ lưu vào file apk_path.txt
        find . -type f -name "*.apk" -size +1000k > apk_path.txt
        
        # In ra màn hình để debug xem tìm thấy gì
        echo "Tìm thấy các file APK:"
        cat apk_path.txt

        # Lấy đường dẫn file đầu tiên tìm thấy và gán cho output (để dùng ở bước sau)
        echo "path=$(head -n 1 apk_path.txt)" >> $GITHUB_OUTPUT

    # Bước 2: Tải file APK đó về máy
    - name: Upload found APK
      uses: actions/upload-artifact@v4
      with:
        name: Duix-Mobile-APK
        # Dùng đường dẫn tìm thấy ở bước trên
        path: ${{ steps.find_apk.outputs.path }}
